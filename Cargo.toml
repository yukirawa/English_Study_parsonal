[package]
name = "shikou-eigo"
version = "0.1.0"
edition = "2024"
rust-version = "1.88"
description = "試験向英語学習 — 英文単語に日本語訳を手動で書き込む学習アプリ"
license = "GPL-3.0-only"
readme = "README.md"
repository = "https://github.com/yukirawa/English_Study_parsonal"
publish = false

[dependencies]
qtbridge = "0.4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
